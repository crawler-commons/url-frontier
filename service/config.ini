# configuration for URL Frontier
# can be overridden on the command line

implementation = crawlercommons.urlfrontier.service.rocksdb.RocksDBService

# number of parallel putURL operations
# the default value is the number of processors / 4
# write.thread.num = 3

# number of parallel reading from queues
# the default value is the number of processors / 4
# read.thread.num = 3

# maximum number of URLs a putURLs stream may have in flight (received but not
# yet acked) before the server stops reading from it; the excess stays on the
# wire, where HTTP/2 flow control pushes back onto the sender. Protects the
# service from clients sending faster than the URLs can be written. Set to 0
# to let the clients send at will, as the service did historically.
# putURLs.max.inflight = 1024

# same thing for the putDiscovered streams, counted in batches rather than
# URLs. Set to 0 to disable.
# putDiscovered.max.inflight = 16

rocksdb.path = /data/crawl/rocksdb
# rocksdb.purge = true

# advanced rocksdb tuning
# see https://github.com/crawler-commons/url-frontier/issues/38

rocksdb.max_background_jobs = 4
rocksdb.max_subcompactions = 2
rocksdb.max_bytes_for_level_base = 536870912

# Bloom filters make the lookup done for every URL sent to putURLs cheap when
# the URL is not known yet, which is the common case when crawling.
# Enabled by default, set to false to disable them.
# rocksdb.bloom.filters = false

# number of bits per key used by the filters: the more bits, the fewer false
# positives and the more memory they need. The default is 10, i.e. about 1.25
# bytes per URL, for a false positive rate of roughly 1%
# rocksdb.bloom.filters.bits_per_key = 10

# note that the filters are kept in memory outside the block cache, which costs
# about 1.25 bytes per URL at the default of 10 bits per key. They are not
# partitioned, so caching them would mean re-reading several MB at a time

# Disabling the write-ahead log roughly halves the bytes written per URL, at the
# cost of losing the updates still in memory if the service dies without closing
# cleanly - the URLs concerned simply get rediscovered by the crawl. The
# memtables are flushed when the service shuts down normally.
# rocksdb.wal.disable = true

# Memory budget in bytes used to size the memtables (a quarter of the budget
# each, up to 6 of them) for each of the four column families. Larger memtables
# mean fewer flushes and compactions, but more memory and a longer recovery
# after a crash. The RocksDB default is 512MB
# rocksdb.memtable_memory_budget = 1073741824

# Set to true to enable gRPC server reflection.
server.enable_reflection = false



